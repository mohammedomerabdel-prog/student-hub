<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السبق الإعلامي | منصة الريان - جامعة بحري</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#f0f4f8;color:#1e293b;line-height:1.8;
    transition: background 0.3s ease, color 0.3s ease;
}

:root{
    --primary:#0f172a;
    --primary2:#1e3a8a;
    --accent:#3b82f6;
    --gold:#f59e0b;
    --white:#ffffff;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 10px 25px -5px rgba(15, 23, 42, 0.08);
}

/* تنسيقات الوضع الليلي */
body.dark-mode {
    background: #0b0f19;
    color: #f1f5f9;
    --primary: #f8fafc;
    --primary2: #38bdf8;
    --white: #111827;
    --muted: #94a3b8;
    --border: #1f2937;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}
body.dark-mode nav { background: rgba(17, 24, 39, 0.95); }
body.dark-mode .nav-container a { color: #e2e8f0; }
body.dark-mode .nav-container a:hover, body.dark-mode .nav-container a.active {
    background: #0284c7; color: #ffffff;
}
body.dark-mode .news-card { background: #111827; border-color: #1f2937; }
body.dark-mode .search-box-wrapper { background: #111827; }
body.dark-mode .search-input { background: #1f2937; color: #f8fafc; border-color: #374151; }

header{
    background:linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    color:white;
    padding:35px 20px;
    text-align:center;
    position:relative;
}
.logo{font-size:40px;font-weight:900;letter-spacing:1px;}
.subtitle{color:#fecaca;margin-top:4px;font-size:16px;font-weight:500;}

.theme-toggle-btn {
    position: absolute; top: 20px; left: 20px;
    background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff; padding: 8px 14px; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-weight: bold; backdrop-filter: blur(5px);
}

nav{
    background:rgba(255, 255, 255, 0.95); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:100; box-shadow:0 4px 20px rgba(0,0,0,0.05);
    border-bottom:1px solid var(--border);
}
.nav-container{max-width:1200px;margin:auto;display:flex;gap:10px;padding:12px 15px;overflow-x:auto;}
.nav-container a{
    text-decoration:none;color:var(--primary);padding:8px 16px;border-radius:12px;
    white-space:nowrap;font-weight:600;font-size:14px;transition:all 0.3s ease;
}
.nav-container a:hover, .nav-container a.active{background:var(--primary2);color:white;}

.search-box-wrapper {
    background: var(--white); padding: 15px 20px; border-bottom: 1px solid var(--border);
}
.search-box-container { max-width: 800px; margin: 0 auto; position: relative; }
.search-input {
    width: 100%; padding: 12px 45px 12px 15px; border: 2px solid var(--border);
    border-radius: 14px; font-size: 15px; font-family: inherit; outline: none;
    background: #f8fafc; color: var(--primary);
}
.search-input:focus { border-color: #ef4444; background: var(--white); }
.search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); }

.container{max-width:1000px;margin:auto;padding:35px 20px;}

.news-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }

.news-card {
    background: var(--white); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; box-shadow: var(--shadow); transition: 0.3s; position: relative;
}
.news-card:hover { transform: translateY(-3px); }
.news-card .badge-tag {
    display: inline-block; background: #fee2e2; color: #dc2626; padding: 4px 12px;
    border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
}
.news-card h3 { font-size: 20px; margin-bottom: 10px; color: var(--primary); }
.news-card p { color: var(--muted); font-size: 15px; margin-bottom: 15px; }
.news-card .news-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px;
}
.news-card .read-more-btn {
    background: #ef4444; color: white; text-decoration: none; padding: 6px 16px;
    border-radius: 10px; font-weight: bold; font-size: 13px; transition: 0.2s;
}
.news-card .read-more-btn:hover { background: #dc2626; }

.loading-state, .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted); background: var(--white);
    border-radius: 20px; border: 1px dashed var(--border); margin-top: 20px;
}

footer{background:var(--primary);color:white;text-align:center;padding:30px 20px;margin-top:50px;}
</style>
</head>

<body>

<header>
    <button class="theme-toggle-btn" id="themeToggleBtn" type="button">🌙 الوضع الليلي</button>
    <div class="logo">🔴 السبق الإعلامي</div>
    <div class="subtitle">منصة الريان | تغطية إخبارية عاجلة ومباشرة على مدار الساعة</div>
</header>

<nav>
    <div class="nav-container">
        <a href="index.html">الرئيسية</a>
        <a href="subjects.html">المواد</a>
        <a href="about.html">عن الكلية</a>
        <a href="results.html">النتيجة</a>
        <a href="exams.html">الاختبارات</a>
        <a href="study-tools.html">الوسائل التعليمية</a>
        <a href="news.html" class="active">السبق الإعلامي</a>
    </div>
</nav>

<div class="search-box-wrapper">
    <div class="search-box-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="newsSearchInput" class="search-input" placeholder="ابحث في الأخبار والبيانات العاجلة..." autocomplete="off">
    </div>
</div>

<main class="container">
    <div id="newsContainer" class="news-grid">
        <div class="loading-state">
            <div style="font-size: 35px; margin-bottom: 10px;">⏳</div>
            <p>جارٍ جلب أحدث الأخبار والمستجدات...</p>
        </div>
    </div>
</main>

<footer>
    <p>© جميع الحقوق محفوظة لـ منصة الريان - جامعة بحري</p>
</footer>

<script>
    // 1. الوضع الليلي
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggleBtn.innerText = document.body.classList.contains('dark-mode') ? '☀ الوضع النهاري' : '🌙 الوضع الليلي';
    });

    let allNews = [];

    // 2. جلب الأخبار من ملف JSON الذي ينتجه news_feed.py
    async function fetchNews() {
        const container = document.getElementById('newsContainer');
        try {
            const response = await fetch('latest_news.json');
            if (!response.ok) throw new Error("تعذر تحميل الأخبار");
            
            allNews = await response.json();
            renderNews(allNews);
        } catch (error) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 40px; margin-bottom: 10px;">📢</div>
                    <h3>لا توجد أخبار حديثة حالياً</h3>
                    <p>سيتم تحديث هذه الصفحة فور صدور أي بيانات جديدة بواسطة السكربت الآلي.</p>
                </div>
            `;
        }
    }

    // 3. عرض الأخبار في الصفحة
    function renderNews(newsList) {
        const container = document.getElementById('newsContainer');
        if (!newsList || newsList.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 40px; margin-bottom: 10px;">🔍</div>
                    <h3>لم نجد أي أخبار تطابق بحثك</h3>
                </div>
            `;
            return;
        }

        container.innerHTML = newsList.map(item => `
            <article class="news-card">
                <span class="badge-tag">${item.category || 'عاجل'}</span>
                <h3>${item.title}</h3>
                <p>${item.summary || item.description || ''}</p>
                <div class="news-meta">
                    <span>🕒 ${item.date || 'اليوم'}</span>
                    ${item.url ? `<a href="${item.url}" target="_blank" class="read-more-btn">قراءة المزيد 🔗</a>` : ''}
                </div>
            </article>
        `).join('');
    }

    // 4. تصفية وبحث الأخبار المباشر
    document.getElementById('newsSearchInput').addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        const filtered = allNews.filter(news => 
            (news.title && news.title.toLowerCase().includes(query)) ||
            (news.summary && news.summary.toLowerCase().includes(query))
        );
        renderNews(filtered);
    });

    // تشغيل جلب الأخبار عند فتح الصفحة
    fetchNews();
</script>

</body>
  </html>
