<title>منصة طلابية | كلية العلوم الإدارية | دفعة 023</title>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#082b52;
    --blue:#1261ad;
    --light:#f5f8fc;
    --text:#17375e;
    --muted:#6b7b90;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:var(--light);
    color:var(--text);
    line-height:1.7;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#06264a,#1261ad);
    color:white;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px #0002;
}

.nav{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:800;
}

.brand img{
    width:52px;
    height:52px;
    object-fit:contain;
    background:white;
    border-radius:50%;
    padding:3px;
}

.brand small{
    display:block;
    font-size:11px;
    font-weight:400;
    opacity:.8;
}

nav{
    display:flex;
    gap:20px;
    align-items:center;
    flex-wrap:wrap;
}

nav a{
    font-size:14px;
    font-weight:700;
}

nav a:hover{
    opacity:.7;
}

/* HERO */

.hero{
    background:
    linear-gradient(
        110deg,
        #06264a 0%,
        #0e4e8c 58%,
        #2d78bd 100%
    );
    color:white;
}

.hero-inner{
    min-height:350px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.hero-text{
    max-width:720px;
}

.badge{
    display:inline-block;
    background:#ffffff1f;
    border:1px solid #ffffff44;
    padding:7px 15px;
    border-radius:999px;
    font-size:13px;
    margin-bottom:15px;
}

.hero h1{
    font-size:clamp(30px,5vw,48px);
    line-height:1.35;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
    opacity:.92;
    margin-bottom:7px;
}

.hero-logo{
    width:190px;
    height:190px;
    object-fit:contain;
    background:white;
    border-radius:25px;
    padding:10px;
}

/* SEARCH */

.search-box{
    margin:25px 0;
    background:white;
    border:1px solid #e1e9f2;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 20px #0b31500d;
}

.search-box label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

.search-wrapper{
    display:flex;
    gap:10px;
}

.search-wrapper input{
    width:100%;
    border:1px solid #d7e1ec;
    border-radius:10px;
    padding:13px 15px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

.search-wrapper input:focus{
    border-color:var(--blue);
}

.search-btn{
    border:0;
    background:var(--navy);
    color:white;
    border-radius:10px;
    padding:0 20px;
    font-family:inherit;
    cursor:pointer;
}

#searchResult{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
}

    display:flex;
    align-items:center;
    gap:15px;
}
