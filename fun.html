<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استطلاع المقدرات والعلاقات | دفعة 023</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #0A192F;
            --primary-blue: #1E3A8A;
            --accent-gold: #D97706;
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background: var(--card-bg);
            width: min(600px, 95%);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            text-align: center;
        }

        .quiz-header h1 {
            font-size: 22px;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .quiz-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* شريط التقدم */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        /* إدخال الاسم */
        .user-info-step input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #CBD5E1;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 20px;
            outline: none;
        }

        .user-info-step input:focus {
            border-color: var(--primary-blue);
        }

        /* حاوية الأسئلة */
        .question-box {
            display: none;
        }

        .question-box.active {
            display: block;
        }

        .category-badge {
            display: inline-block;
            background: #FEF3C7;
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .question-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            background: #F1F5F9;
            border: 2px solid #E2E8F0;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            font-family: inherit;
        }

        .btn-option:hover {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .btn-main {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn-main:hover {
            background: var(--accent-gold);
        }

        /* صفحة النتيجة */
        .result-box {
            display: none;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            margin-top: 15px;
            text-decoration: none;
        }

        .whatsapp-btn:hover {
            background: #1EBE5D;
        }
    </style>
</head>

<body>

    <div class="quiz-card">
        <div class="quiz-header">
            <h1>📊 استطلاع المقدرات والعلاقات</h1>
            <p>كلية العلوم الإدارية - دفعة 023</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- الخطوة 0: إدخال اسم الطالب -->
        <div id="stepName" class="user-info-step">
            <h3 style="margin-bottom: 15px;">اكتب اسمك للبدء في الاستطلاع:</h3>
            <input type="text" id="studentName" placeholder="الاسم الثلاثي..." required>
            <button class="btn-main" onclick="startQuiz()">ابدأ الأسئلة 🚀</button>
        </div>

        <!-- حاوية الأسئلة الديناميكية -->
        <div id="quizContainer"></div>

        <!-- الخطوة الأخيرة: النتيجة وإرسال الواتساب -->
        <div id="resultBox" class="result-box">
            <h2 style="color: var(--primary-dark); margin-bottom: 10px;">أحسنت! أكملت الاستطلاع 🥳</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">اضغط على الزر بالأسفل لإرسال إجاباتك مباشرة إلى أدمن الدفعة عبر الواتساب لتسجيل مشاركتك.</p>
            <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                💬 إرسال الإجابات عبر الواتساب
            </button>
        </div>
    </div>

    <!-- كود الصوت للضغطات -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
        document.addEventListener('click', function(e) {
            if (e.target.closest('button, .btn-option')) playClickSound();
        });
    </script>

    <!-- كود إدارة الأسئلة والواتساب -->
    <script>
        // رقم الواتساب الخاص بك المربوط بالخدمة
        const ADMIN_PHONE = "249995040725"; 

        const questions = [
            // قسم المستوى الأكاديمي
            { category: "المستوى الأكاديمي", title: "كيف تقيّم مستواك وحضورك في المحاضرات؟", options: ["مواظب جداً وبسجل الملاحظات", "بحضر أغلب المحاضرات", "بحضر قبل الامتحانات فقط", "اعتمادي الكامل على الملخصات"] },
            { category: "المستوى الأكاديمي", title: "عند مواجهة مادة صعبة، كيف تتصرف؟", options: ["بشرحها لنفسي وببحث في الإنترنت", "بطلب مساعدة من زملائي في الدفعة", "بأجلها لقرب الامتحان", "بكتفي بالحفظ بدون فهم عميق"] },

            // قسم المقدرات والمهارات
            { category: "المقدرات والمهارات", title: "ما هي أكثر مهارتك تميزاً داخل الكلية؟", options: ["التنظيم والقيادة وتنسيق التكاليف", "الشرح وتوصيل المعلومة للزملاء", "التصميم والتقنية وإعداد العروض", "الاستماع والدعم المعنوي للجميع"] },
            { category: "المقدرات والمهارات", title: "ما مدى قدرتك على العمل ضمن فريق (Group Work)؟", options: ["ممتازة جداً وأحب قيادة الفريق", "جيدة وألتزم بالمهام المطلوبة مني", "أفضل العمل الفردي لتفادي المشاكل", "حسب الأعضاء المشاركين معي"] },

            // قسم العلاقات والتواصل
            { category: "العلاقات والصداقات", title: "كيف تصف علاقتك بزملائك في دفعة 023؟", options: ["اجتماعي وأعرف معظم طلاب الدفعة", "عندي دائرة أصدقاء مقربة ومحدودة", "هادئ وعلاقتي رسمية مع الجميع", "جديد على الدفعة وأحاول التعرف أكثر"] },
            { category: "العلاقات والصداقات", title: "إذا لاحظت زميلاً يمر بظرف أكاديمي أو شخصي صعب؟", options: ["أبادر فوراً بالمساعدة والدعم", "أسأله إذا كان يحتاج شيء بخجل", "أتمنى له التوفيق دون تدخل مباشر", "أوجهه لأحد أصدقائه المقربين"] }
        ];

        let currentQuestion = 0;
        let userAnswers = [];
        let studentName = "";

        function startQuiz() {
            let nameInput = document.getElementById('studentName').value.trim();
            if (!nameInput) {
                alert("لطفاً، أدخل اسمك أولاً لنبدأ!");
                return;
            }
            studentName = nameInput;
            document.getElementById('stepName').style.display = 'none';
            renderQuestion();
        }

        function renderQuestion() {
            let container = document.getElementById('quizContainer');
            let q = questions[currentQuestion];

            let progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + "%";

            let html = `
                <div class="question-box active">
                    <span class="category-badge">${q.category}</span>
                    <div class="question-title">${q.title}</div>
                    <div class="options-grid">
                        ${q.options.map((opt) => `
                            <button class="btn-option" onclick="selectAnswer('${opt}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function selectAnswer(answer) {
            userAnswers.push({
                question: questions[currentQuestion].title,
                answer: answer
            });

            currentQuestion++;

            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizContainer').innerHTML = '';
            document.getElementById('progressFill').style.width = "100%";
            document.getElementById('resultBox').style.display = 'block';
        }

        function sendToWhatsApp() {
            let message = `*إجابات استطلاع المقدرات والعلاقات - دفعة 023* 📝\n\n`;
            message += `👤 *اسم الطالب:* ${studentName}\n`;
            message += `-----------------------------------\n\n`;

            userAnswers.forEach((item, index) => {
                message += `*س${index + 1}: ${item.question}*\n`;
                message += `👈 *الإجابة:* ${item.answer}\n\n`;
            });

            let encodedMessage = encodeURIComponent(message);
            let whatsappUrl = `https://wa.me/${ADMIN_PHONE}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
